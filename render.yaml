# Render Blueprint: https://render.com/docs/blueprint-spec
# Mirror of cecil.app, built with the Cecil standalone binary (no PHP).

services:
  - type: web
    runtime: static
    name: cecil
    buildCommand: bash ./scripts/render-build.sh
    staticPublishPath: ./_site
    autoDeployTrigger: commit
    previews:
      generation: automatic
    buildFilter:
      ignoredPaths:
        - .github/**
        - README.md
        - lighthouserc.json
        - netlify.toml
        - vercel.json
    envVars:
      # GitHub API token, to avoid rate limit when fetching data (optional)
      - key: GITHUB_TOKEN
        sync: false
      # Cecil release to use (latest by default)
      #- key: CECIL_VERSION
      #  value: 9.11.0
      # Base URL of the production deployment (onrender.com URL by default)
      #- key: CECIL_BASEURL
      #  value: https://cecil.app/
    # HTTP headers (from the "_headers" file generated by Cecil)
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      # this is a mirror, so it must not be indexed
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /favicon*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /logo*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /icon*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /videos/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /styles/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /javascript/*
        name: Cache-Control
        value: private, max-age=31536000
      - path: /js/*
        name: Cache-Control
        value: private, max-age=31536000
      - path: /*.js
        name: Cache-Control
        value: private, max-age=31536000
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.webmanifest
        name: Cache-Control
        value: private, max-age=31536000
      - path: /admin/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate, max-age=0
    # Redirects of non-HTML files (HTML pages redirects are handled by Cecil)
    routes:
      - type: redirect
        source: /build.sh
        destination: https://raw.githubusercontent.com/Cecilapp/Cecil/master/scripts/cecil-build.sh
